# opbd configuration. Install as
#   ~/Library/Application Support/op-broker/config.yaml   (chmod 600)
#
# Send SIGHUP to opbd to reload the rules and reopen the log file. Other
# settings, op.accounts included, require a restart: a reload whose accounts
# differ from the running ones is rejected and the previous rules are kept.

# Tailnet node name of the broker.
hostname: op-broker

# tsnet state (node keys). Created with mode 0700.
state_dir: ~/Library/Application Support/op-broker/tsnet

# Address to listen on inside the tailnet.
listen: ":80"

# Audit log (mode 0600). Empty means stderr.
log_file: ~/Library/Logs/op-broker.log

# Total time allowed for a request, including time spent queued behind other
# requests and waiting for Touch ID approval on the Mac.
request_timeout: 120s

op:
  path: /opt/homebrew/bin/op
  # REQUIRED: the 1Password accounts to read from, as alias -> account UUID.
  # Clients (opb --account) and rules (accounts:) only use the aliases:
  # lowercase letters, digits, "_" and "-", at most 32 characters. Note that
  # `op account list` shows your USER ID, not the account's: get the account
  # UUID ("ID") with `op account get --account <sign-in address>`, e.g.
  # `op account get --account my.1password.com`.
  accounts:
    work: XXXXXXXXXXXXXXXXXXXXXXXXXX
    personal: YYYYYYYYYYYYYYYYYYYYYYYYYY
  # Account of requests that name none, and of rules that list none.
  # Required with more than one account.
  default_account: work
  # Older configurations set a single account instead of the two settings
  # above; it is the account "default", and the default:
  #   account: XXXXXXXXXXXXXXXXXXXXXXXXXX
  # Time allowed for one op invocation, including waiting for you to approve
  # a Touch ID prompt on the Mac.
  timeout: 60s

# Access rules. Everything not granted here is denied.
#
# Principals (a rule applies to ANY of its principals):
#   user:<login>      untagged devices owned by this Tailscale user
#   tag:<name>        tagged devices (a tagged device never matches user:)
#   node:<stable-id>  one device, by its stable node ID (see the audit log or
#                     `tailscale status --json`, field "ID")
#
# Accounts (aliases from op.accounts): the accounts a rule applies to. A rule
# without accounts applies to op.default_account ONLY, never to every
# account: references have no account part, and every account has, e.g., a
# "Private" vault, so a grant on op://Private/** must not silently extend to
# another account's Private vault. List accounts explicitly to grant more.
#
# Patterns are case-insensitive. "*" matches one path segment, a final "**"
# matches the rest.
#   read:  field reads (opb read / inject / run). A field grant covers every
#          attribute of the field (e.g. ?attribute=otp, but also the TOTP seed).
#   items: whole-item reads (opb item get), op://vault/item only. Never
#          implied by read patterns.
# Vault and item names may be renamed in 1Password; prefer IDs for sensitive
# grants. Names are compared literally: the personal vault of a business
# account answers to both "Employee" and "Private" in op, so grant it by ID
# (see `op vault list --account <account UUID>`) to cover both spellings.
rules:
  # No accounts: work (the default account) only.
  - principals: ["user:sylvain@formance.com"]
    read: ["op://Dev/**"]
    items: ["op://Dev/postgres"]

  # The Private vault of the personal account, and not the work one's.
  - principals: ["user:sylvain@formance.com"]
    accounts: [personal]
    read: ["op://Private/**"]

  - principals: ["tag:ci"]
    read: ["op://CI/deploy-key/private key"]
