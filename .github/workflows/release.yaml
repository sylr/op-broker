name: Release

on:
  push:
    tags:
    - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # No Nix store cache here: a cache any workflow run can write must not
    # feed the binaries we sign and publish. The shell is fetched from
    # cache.nixos.org instead.

    # Same shell as the CI goreleaser job, so the release is built with the
    # exact go, goreleaser and syft versions that CI validated.
    - name: Run GoReleaser
      run: nix develop .#ci-goreleaser --command goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # PAT (or fine-grained token) with contents:write on sylr/homebrew-tap,
        # since the built-in GITHUB_TOKEN is scoped only to this repo.
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        # Same, with contents:write on sylr/nur-packages.
        NUR_GITHUB_TOKEN: ${{ secrets.NUR_GITHUB_TOKEN }}

    # Mint a GitHub build-provenance attestation for every released file
    # (archives, DEBs, RPMs, SBOMs) listed in goreleaser's checksum file.
    # Verify with: gh attestation verify <file> --owner sylr
    - name: Attest release artifacts
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
      with:
        subject-checksums: dist/checksums.txt
